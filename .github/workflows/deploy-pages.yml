name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', 'fonts/**']

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The shared font directory is committed once at the repo root and copied in
      # here, so it is not duplicated inside public/ as well.
      - name: Stage shared fonts
        run: cp -R fonts public/fonts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
