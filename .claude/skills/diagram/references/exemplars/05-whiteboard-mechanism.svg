<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520"
     font-family="'Inter Display', Pretendard, sans-serif">

  <!-- archetype: whiteboard mechanism. sequence rows of bucket state per tick,
       over an inline plot of the same quantity against time.
       register: WHITEBOARD. sharp corners (rx=0), white fills, #000 outlines.
       encoding: colour = tokens. one amber mark is one available token; the same
       amber draws the level line and its dashed capacity ceiling. one hue,
       nothing else on the canvas is coloured. -->

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <!-- bucket rows: 12 slots, pixel-identical geometry on every row -->
  <g>
    <rect x="96" y="12" width="48" height="40" fill="#ffffff"
