  <!-- what one request costs, bracketed under the row that cannot pay it -->
  <path d="M96,300 V306 H312 V300" fill="none"
        stroke="#3a414a" stroke-width="1" stroke-linejoin="round"/>

  <!-- inline plot: two axis lines, no frame, no gridlines, no ticks -->
  <path d="M96,356 V484" fill="none" stroke="#3a414a" stroke-width="2"/>
  <path d="M96,484 H880" fill="none" stroke="#3a414a" stroke-width="2"/>
  <path d="M96,364 H880" fill="none" stroke="#e8822a" stroke-width="2"
        stroke-dasharray="6 4" stroke-linecap="round"/>
  <path d="M96,364 L180,374 L264,384 L348,394 L432,404 L516,414 L600,424 L684,434 L768,444 L852,454" fill="none"
        stroke="#e8822a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

