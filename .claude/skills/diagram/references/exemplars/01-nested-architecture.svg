<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"
     font-family="'Inter Display', Pretendard, sans-serif">

  <!-- archetype: nested-container architecture
       encoding: colour = operational ownership. amber = self-operated, blue = managed
       service, white = external. 2 hues. dashed grey rect = trust boundary. -->

  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a414a"/>
    </marker>
    <marker id="ah-hair" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#979ea8"/>
    </marker>
  </defs>

  <!-- boundaries -->
  <rect x="176" y="56" width="208" height="296" rx="6" fill="none"
        stroke="#979ea8" stroke-width="2" stroke-dasharray="6 4"
        stroke-linejoin="round"/>
  <rect x="432" y="24" width="272" height="360" rx="6" fill="none"
        stroke="#979ea8" stroke-width="2" stroke-dasharray="6 4"
        stroke-linejoin="round"/>
  <rect x="736" y="56" width="248" height="296" rx="6" fill="none"
        stroke="#979ea8" stroke-width="2" stroke-dasharray="6 4"
        stroke-linejoin="round"/>

  <!-- boxes -->
  <rect x="20" y="176" width="124" height="52" rx="26" fill="#ffffff"
        stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

  <rect x="200" y="112" width="160" height="56" rx="6" fill="#edf5ff"
        stroke="#6db1ff" stroke-width="2" stroke-linejoin="round"/>
  <rect x="200" y="224" width="160" height="56" rx="6" fill="#edf5ff"
        stroke="#6db1ff" stroke-width="2" stroke-linejoin="round"/>

  <rect x="456" y="80" width="224" height="56" rx="6" fill="#fff3d9"
        stroke="#e8822a" stroke-width="2" stroke-linejoin="round"/>

  <rect x="480" y="216" width="200" height="64" rx="6" fill="#fff3d9"
        stroke="#e8822a" stroke-width="2" stroke-linejoin="round"/>
  <rect x="468" y="208" width="200" height="64" rx="6" fill="#fff3d9"
        stroke="#e8822a" stroke-width="2" stroke-linejoin="round"/>
  <rect x="456" y="200" width="200" height="64" rx="6" fill="#fff3d9"
        stroke="#e8822a" stroke-width="2" stroke-linejoin="round"/>

  <path d="M752,124 a44,12 0 0 1 88,0 v48 a44,12 0 0 1 -88,0 z" fill="#ffffff"
        stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M752,124 a44,12 0 0 0 88,0" fill="none"
        stroke="#000000" stroke-width="2"/>
  <path d="M880,124 a44,12 0 0 1 88,0 v48 a44,12 0 0 1 -88,0 z" fill="#ffffff"
        stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M880,124 a44,12 0 0 0 88,0" fill="none"
        stroke="#000000" stroke-width="2"/>

  <rect x="752" y="248" width="216" height="56" rx="6" fill="#edf5ff"
        stroke="#6db1ff" stroke-width="2" stroke-linejoin="round"/>

  <!-- connectors -->
  <path d="M148,202 H168 Q176,202 176,194 V148 Q176,140 184,140 H194" fill="none"
        stroke="#3a414a" stroke-width="2" stroke-linejoin="round"
        marker-end="url(#ah-ink)"/>
  <path d="M280,172 V218" fill="none"
        stroke="#3a414a" stroke-width="2" marker-end="url(#ah-ink)"/>
  <path d="M364,252 H392 Q400,252 400,244 V116 Q400,108 408,108 H450" fill="none"
        stroke="#3a414a" stroke-width="2" stroke-linejoin="round"
        marker-end="url(#ah-ink)"/>
  <path d="M568,140 V194" fill="none"
        stroke="#3a414a" stroke-width="2" marker-end="url(#ah-ink)"/>
  <path d="M680,220 H700 Q708,220 708,212 V158 Q708,150 716,150 H746" fill="none"
        stroke="#3a414a" stroke-width="2" stroke-linejoin="round"
        marker-end="url(#ah-ink)"/>
  <path d="M680,244 H700 Q708,244 708,252 V268 Q708,276 716,276 H746" fill="none"
        stroke="#3a414a" stroke-width="2" stroke-linejoin="round"
        marker-end="url(#ah-ink)"/>
  <path d="M844,150 H874" fill="none"
        stroke="#3a414a" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- leader -->
  <path d="M556,328 Q556,304 572,290" fill="none"
        stroke="#979ea8" stroke-width="1" marker-end="url(#ah-hair)"/>

  <!-- text, last -->
  <text x="192" y="80" font-size="15.56" font-style="italic" fill="#6f7681">edge</text>
  <text x="448" y="48" font-size="15.56" font-style="italic" fill="#6f7681">application cluster</text>
  <text x="752" y="80" font-size="15.56" font-style="italic" fill="#6f7681">data tier</text>

  <text x="82" y="202" font-size="17.78" font-weight="700" fill="#000000"
        text-anchor="middle" dominant-baseline="central">client</text>
  <text x="280" y="140" font-size="17.78" font-weight="700" fill="#000000"
        text-anchor="middle" dominant-baseline="central">CDN</text>
  <text x="280" y="252" font-size="17.78" font-weight="700" fill="#000000"
        text-anchor="middle" dominant-baseline="central">load balancer</text>
  <text x="568" y="108" font-size="17.78" font-weight="700" fill="#000000"
        text-anchor="middle" dominant-baseline="central">api gateway</text>
  <text x="556" y="232" font-size="17.78" font-weight="700" fill="#000000"
        text-anchor="middle" dominant-baseline="central">worker</text>
  <text x="796" y="156" font-size="17.78" font-weight="700" fill="#000000"
        text-anchor="middle" dominant-baseline="central">primary</text>
  <text x="924" y="156" font-size="17.78" font-weight="700" fill="#000000"
        text-anchor="middle" dominant-baseline="central">replica</text>
  <text x="860" y="276" font-size="17.78" font-weight="700" fill="#000000"
        text-anchor="middle" dominant-baseline="central">cache</text>

  <text x="860" y="212" font-size="15.56" font-weight="700" fill="#000000"
        text-anchor="middle">replicates</text>
  <text x="556" y="344" font-size="13.33" font-style="italic" fill="#6f7681"
        text-anchor="middle">one per zone</text>

</svg>
